apiVersion: apps/v1
kind: Deployment
metadata: {name: multicloud-frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: multicloud-frontend}}
  template:
    metadata: {labels: {app: multicloud-frontend}}
    spec:
      containers:
      - name: frontend
        image: multicloud-frontend:latest
        ports: [{containerPort: 5173}]
---
apiVersion: v1
kind: Service
metadata: {name: multicloud-frontend}
spec:
  type: LoadBalancer
  selector: {app: multicloud-frontend}
  ports: [{port: 5173,targetPort: 5173}]
