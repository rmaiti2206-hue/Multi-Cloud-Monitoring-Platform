services:
  backend:
    build: ../backend
    ports: ["8000:8000"]
    env_file: ../.env
  frontend:
    build: ../frontend
    ports: ["5173:5173"]
    depends_on: [backend]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [backend]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [prometheus]
